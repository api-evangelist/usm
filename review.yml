- date: '2026-09-01'
  rating: 3
  summary: 'Re-profiled under the university pipeline''s operator axis. USM operates no developer programme,
    but three institution-operated machine-readable surfaces were verified live on hosts under usm.my:
    the Repository@USM OAI-PMH 2.0 endpoint (EPrints 3.3.16, six metadata prefixes), the Repository@USM
    EPrints REST and export tree (EP2 data XML, single-field plain-text access, seventeen export serializations),
    and USM''s own Shibboleth SAML 2.0 identity provider at shibsso.usm.my, registered in the SIFULAN
    Malaysian Access Federation since 2021-10-30 and exported to eduGAIN. A self-hosted Moodle exposes
    a token-gated REST web service; its contract is Moodle''s and was deliberately not saved here. USM
    is Crossref member 8963 (prefixes 10.21315, 10.36777, 4,955 DOIs) and holds ROR 02rgb2k63; it is not
    a DataCite provider or client. THREE CORRECTIONS to the 2026-06-03 review: api.usm.my is NOT a gated
    API catalog - it is an unmodified TemplateMo ''Chain App Dev'' HTML template with lorem ipsum copy
    and info@company.co as its contact, and has been removed from apis[]; www.usm.my is not blocking,
    the earlier 403 was a bot challenge and it returns 200 to a browser User-Agent; and the Shibboleth
    IdP, the strongest surface USM operates, was missing entirely.'
  endpoints:
  - url: https://eprints.usm.my/cgi/oai2?verb=Identify
    status: 200
    note: OAI-PMH 2.0 Identify - repositoryName "USM Repository", EPrints 3.3.16, deletedRecord persistent,
      earliestDatestamp 2013-07-13.
  - url: https://eprints.usm.my/cgi/oai2?verb=ListMetadataFormats
    status: 200
    note: 'Six prefixes: didl, mets, oai_bibl, oai_dc, rdf, uketd_dc.'
  - url: https://eprints.usm.my/cgi/oai2?verb=ListSets
    status: 200
    note: Sets present; setSpecs are hex-encoded EPrints view keys, not readable labels.
  - url: https://eprints.usm.my/rest/
