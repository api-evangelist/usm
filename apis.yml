      - type: Conformance
        url: conformance/usm-education-standards-conformance.yml
  - aid: usm:ror-record
    name: ROR record — Universiti Sains Malaysia
    x-operator: registry
    description: >-
      USM's Research Organization Registry identifier, https://ror.org/02rgb2k63. The
      identifier is the join key used by ORCID, Crossref and DataCite to attribute
      research output to the institution — 4,821 ORCID records carried an affiliation
      to this ROR id on 2026-09-01. Hospital Universiti Sains Malaysia holds a separate
      ROR record (0090j2029) and is not this entity.
    humanURL: https://ror.org/02rgb2k63
    baseURL: https://api.ror.org/v2/organizations/02rgb2k63
    tags: [ Registry, ROR, Research Identifiers, Membership ]
    properties:
