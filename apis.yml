  - aid: usm:eprints-rest
    name: USM Repository EPrints REST and Export
    x-operator: institution
    description: >-
      Anonymous read interface to Repository@USM beyond OAI-PMH, verified route by
      route on 2026-09-01. /rest/ exposes three datasets (eprint, user, subject);
      /rest/eprint/{id}.xml returns full EPrints EP2 data XML; /rest/eprint/{id}/{field}.txt
      gives single-field plain-text access; /rest/subject/{id}.xml walks the Library of
      Congress subject tree; and /cgi/export/eprint/{id}/{format}/{filename} serves
      seventeen verified bibliographic serializations including JSON, RDF/XML, METS,
      MODS, DIDL, Atom, BibTeX and RIS. One soft-404 trap is documented in the
      contract: /rest/eprint/{id}.json answers HTTP 200 with the repository's HTML
      landing page, not JSON.
    humanURL: https://eprints.usm.my/rest/
    baseURL: https://eprints.usm.my
