  - aid: usm:shibboleth-idp
    name: USM Shibboleth Identity Provider (SIFULAN / eduGAIN)
    x-operator: federation
    description: >-
      USM's own SAML 2.0 Shibboleth identity provider, entityID
      https://shibsso.usm.my/idp/shibboleth, scope usm.my. Registered in the SIFULAN
      Malaysian Access Federation on 2021-10-30 under registration authority
      https://sifulan.my, carried in SIFULAN's eduGAIN export, and tagged with the
      REFEDS Research and Scholarship entity category. Published bindings: SSO over
      HTTP-POST, HTTP-Redirect and POST-SimpleSign plus the Shibboleth 1.0 AuthnRequest
      profile; SLO over POST, Redirect and SOAP; an AttributeAuthority over SAML1 and
      SAML2 SOAP; artifact resolution over SOAP. In live production use — an
      unauthenticated request to eduvpn.usm.my lands on the IdP's SAML2 Redirect SSO
      endpoint. A federation is shared by definition; the IdP behind it is USM's.
    humanURL: https://www.usm.my
    baseURL: https://shibsso.usm.my/idp/shibboleth
    tags: [ Identity Federation, Shibboleth, SAML, SSO, eduGAIN, SIFULAN ]
    properties:
