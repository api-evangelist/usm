apis:
  - aid: usm:eprints-oai
    name: USM Repository OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH 2.0 metadata-harvesting interface for Repository@USM, the EPrints 3.3.16
      institutional repository USM runs on its own host. The live Identify response
      gives repositoryName "USM Repository", protocolVersion 2.0, adminEmail
      eprints@usm.my, earliestDatestamp 2013-07-13T00:03:59Z, deletedRecord persistent
      and granularity to the second. Six metadata prefixes are advertised — didl, mets,
      oai_bibl, oai_dc, rdf, uketd_dc. Anonymous read; no key. Two caveats a harvester
      must know: every error condition returns HTTP 200 with the fault in the body, and
      the repositoryIdentifier is still the EPrints default "generic.eprints.org"
      rather than usm.my, so minted OAI identifiers are not globally distinguishable.
    humanURL: https://eprints.usm.my/
    baseURL: https://eprints.usm.my/cgi/oai2
    tags: [ Repository, OAI-PMH, Research, Open Access, Metadata, EPrints ]
