aid: usm
name: Universiti Sains Malaysia
x-type: university
x-category: Public Research University
description: >-
  Universiti Sains Malaysia (USM) is a public research university founded in 1969 in
  Penang, Malaysia, holding APEX (Accelerated Programme for Excellence) status. USM
  operates no developer programme, no API catalog and no developer documentation of any
  kind, and its programmable footprint is entirely a by-product of the software it runs
  rather than anything it publishes for integrators. Three institution-operated
  machine-readable surfaces were verified live on 2026-09-01, all on hosts under usm.my:
  the OAI-PMH 2.0 endpoint and the EPrints REST/export tree of Repository@USM
  (eprints.usm.my, EPrints 3.3.16, seventeen export serializations), and USM's own
  Shibboleth SAML 2.0 identity provider at shibsso.usm.my, registered in the SIFULAN
  Malaysian Access Federation since 2021 and exported to eduGAIN. USM is a Crossref
  member (id 8963, prefixes 10.21315 and 10.36777) and holds a ROR record; it is not a
  DataCite provider or client. The host advertised as an API portal, api.usm.my, is an
  unmodified commercial HTML template with lorem ipsum body copy and no catalog behind
  its login — it is scaffolding, not a gated API programme, and this profile no longer
  counts it as a surface.
