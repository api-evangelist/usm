  - aid: usm:crossref-member
    name: Crossref membership — Universiti Sains Malaysia
    x-operator: registry
    description: >-
      USM is Crossref member 8963, registering DOIs under prefixes 10.21315 (USM Press
      journals such as the Malaysian Journal of Medical Sciences, Journal of Physical
      Science, Kajian Malaysia and Tropical Life Sciences Research) and 10.36777. As of
      2026-09-01 the membership carries 4,955 registered DOIs — 1,365 current and 3,590
      backfile. This is a fact about USM recorded through a shared registry; Crossref's
      own contract belongs to Crossref and is not saved here.
    humanURL: https://www.crossref.org/
    baseURL: https://api.crossref.org/members/8963
    tags: [ Registry, DOI, Crossref, Scholarly Publishing, Membership ]
    properties:
      - type: Registration
