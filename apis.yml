x-coverage:
  state: covered
  reason: covered
  detail: >-
    Three institution-operated machine-readable surfaces were found, probed and
    contracted on 2026-09-01 — the Repository@USM OAI-PMH endpoint, the Repository@USM
    EPrints REST and export tree, and USM's own Shibboleth SAML identity provider in
    SIFULAN and eduGAIN — plus a token-gated self-hosted Moodle web-service endpoint and
    two registry memberships (Crossref 8963, ROR 02rgb2k63). What USM does NOT have is a
    developer programme: no catalog, no documentation, no terms, no status page, no
    changelog, no GitHub organization (github.com/usm-my 404), no open-data portal
    (data.usm.my does not resolve), and no declared metadata or data policy — the
    repository still ships the EPrints default "this server has not yet been fully
    configured" text. The api.usm.my "developer portal" carried in the June 2026 profile
    as a gated catalog was re-examined and is an unmodified TemplateMo "Chain App Dev"
    HTML template with lorem ipsum copy and info@company.co as its contact; it has been
    removed from apis[] and is retained only as a DeveloperPortal pointer. A previously
    recorded 403 on www.usm.my was a bot challenge, not a dead host — it returns 200 to
    a browser User-Agent. On the AI axis, the only guidance found on a USM host is the
    Ministry of Higher Education's national generative-AI guideline (Garis Panduan Penggunaan
    Teknologi Kecerdasan Buatan Generatif dalam PdP Pendidikan Tinggi), republished as a PDF by
    USM's Centre for Development of Academic Excellence at cdae.usm.my — it is recorded as the
    AIPolicy pointer because it is the operative guidance, but it is MOHE's document, not a
    USM-authored policy, and no USM-authored AI policy was found in English or Malay.
