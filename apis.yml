  - aid: usm:moodle-ws
    name: e-Learning@USM Moodle Web Services
    x-operator: institution
    description: >-
      Self-hosted Moodle at elearning.usm.my with the REST web-service server enabled
      and token-gated. An unauthenticated call returns Moodle's own invalidtoken
      exception, which proves the service is live rather than absent. The deployment,
      the host and the data are USM's; the contract is Moodle's, so no Moodle
      specification is saved under this institution — the relationship is recorded, the
      vendor's contract is not.
    humanURL: https://elearning.usm.my/sidang2526/
    baseURL: https://elearning.usm.my/sidang2526/webservice/rest/server.php
    tags: [ Learning Management, Moodle, LMS, Token Auth ]
    properties:
